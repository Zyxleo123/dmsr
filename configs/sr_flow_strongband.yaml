# SR null-space residual flow -- STRENGTHENED DISTRIBUTIONAL TERM.
# Clean ablation vs runs/flow_cascade: the ONLY change is lambda_band 1 -> 8.
#
# Why: flow_cascade mean-collapsed. Its own val metrics show the generated
# null-space residual carries ~half the true power at every octave
# (respow 0.39-0.51), with small-scale (high-k) recovery worst at the top
# octave (highk64 0.87 -> highk128 0.69 -> highk256 0.63). MSE-on-velocity flow
# matching regresses a near-white stochastic target toward its conditional mean,
# which under-disperses. L_band is the only term that pushes power back to the
# true residual spectrum, but at lambda_band=1 the direct FM gradient dominated
# the (weaker, unrolled-sample) band gradient. Crank it.
#
# Everything else identical to flow_cascade so the before/after is attributable.
# Watch: val_respow (target 1.0, was 0.47) and val_highk (was 0.73). If this only
# partially closes the gap, the residual-space adversarial critic is the next lever.
factor: 2
resolutions: [64, 128, 256]

data:
  paired_hr_glob: "/zfsauton/scratch/yixiz/DMSR/paired_catnorm/hr/set[0-2].npy"
  val_hr_glob: "/zfsauton/scratch/yixiz/DMSR/paired_catnorm/hr/set15.npy"
  crop_hr: 128
  n_levels: 4
  full_res: 512
  mmap: true
  lr_only:
    - glob: "/zfsauton/scratch/yixiz/DMSR/lr_sims/set*/catnorm.npy"       # Ng=64
      res: 64
      crop: 16
      pool: 1
    - glob: "/zfsauton/scratch/yixiz/DMSR/lr_sims_256/set*/catnorm.npy"   # Ng=256
      res: 128
      crop: 64
      pool: 2
    - glob: "/zfsauton/scratch/yixiz/DMSR/lr_sims_256/set*/catnorm.npy"   # Ng=256
      res: 256
      crop: 64
      pool: 1

model:
  channels: 6
  width: 64
  depth: 4
  embed_dim: 128
  context_channels: 0
  grad_checkpoint: true

base_upscaler:
  kind: identity

loss:
  n_bands: 8
  lambda_deg: 1.0
  lambda_band: 8.0        # <-- the only change vs flow_cascade (was 1.0)
  band_ema: 0.9
  lr_sample_steps: 4

train:
  batch_size: 1
  lr: 1.0e-4
  steps: 40000
  seed: 0
  log_every: 50
  save_every: 2000
  eval_every: 500
  amp: true

wandb:
  mode: online
  project: cosmo_sr
  name: sr_flow_strongband
  group: sr_fix

output:
  run_dir: runs/sr_flow_strongband

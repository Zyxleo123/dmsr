# PREREQUISITE (phase 1) -- deterministic null-space regression on the 13-box
# train split. Identical to paired_deterministic.yaml except the enlarged split.
# Its ckpt_best.pt is the FROZEN mean consumed by the mean/innovation arm, so it
# MUST see the same train data as everything else (otherwise E is confounded).
base: _base_train13.yaml
stage: det
train: {steps: 40000}
wandb: {name: dmsr_t13_paired_deterministic, group: dmsr_train13}
output: {run_dir: runs/dmsr/t13_paired_deterministic}

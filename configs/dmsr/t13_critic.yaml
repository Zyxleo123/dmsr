# ARM 2/4 -- CRITIC. Null-space flow + HR critic, critic fakes from PAIRED LR
# crops only (= Stage C). Warm-starts from the phase-1 Stage B trained on the
# same 13-box split. Identical to the locked Stage C recipe (per launch_cvd.sh,
# which overrode the encoder to encoder_frozen.pt) except the enlarged split and
# the new-split init. lambda_adv 0.003 kept (calibrated against the Stage B grad
# norm; see dmsr-stage memory).
base: _base_train13.yaml
stage: c
model:
  condition_encoder_init: lr_pretrained
  encoder_ckpt: runs/dmsr/lr_ssl/encoder_frozen.pt   # matches locked Stage C launch
  init_from: runs/dmsr/t13_stage_b/ckpt_best.pt      # phase-1 Stage B (new split)
adv:
  lambda_adv: 0.0030
  start_step: 0
  ramp_steps: 2000
  n_critic: 1
  critic_warmup_steps: 200
train: {steps: 20000, seed: 0}
wandb: {name: dmsr_t13_critic, group: dmsr_train13}
output: {run_dir: runs/dmsr/t13_critic_s0}

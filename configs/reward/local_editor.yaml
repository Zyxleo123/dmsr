# Host-conditioned generative local editor.
#
#     Psi_out = Psi_SR2 + E(Psi_SR2, C, a)
#
# A SEPARATE pipeline from the residual-diffusion line in reward.yaml. It shares
# the data layout, the splits and the halo-finding plumbing, and shares no
# conclusions: nothing here trains, resumes or reads the six-channel residual
# prior. Artifacts go under $ZFS/DMSR/dmsr_local_editor/, never under the reward
# root and never under home or the repository.
#
# The `constraints` block below is UNCALIBRATED. Every scoring script refuses to
# run until scripts/reward/audit_local_editor_constraints.py has measured the
# four populations (frozen SR2 / oracle interventions / random controls /
# deployment-legal candidates), you have pasted its proposed block in, and set
# `calibrated: true`. The reward.yaml thresholds are NOT a valid substitute:
# they were derived from a whole-field residual and low_k_change_max = 0.02
# would reject a localised edit for the wrong reason.

freeze: configs/sr2_baseline/freeze.yaml

data:
  root: /zfsauton/scratch/yixiz/DMSR/paired_catnorm
  boxsize_mpc_h: 100.0
  dis_norm_kpc_h: 6000.0     # must equal what preprocess_srs.disnorm uses; checked
  redshift: 0.0
  # Simulation cosmology, used only for the tracer particle mass (5.82e8 Msun/h
  # at 512^3 in a 100 Mpc/h box). Matches cosmo_sr.eval.particles' default.
  omega_m: 0.2814
  scale_factor: 8
  ng_lr: 64
  ng_hr: 512

# Mirrors reward.yaml so a leak is a diff, not an inference. set13/14/15 stay
# closed until the final comparison; nothing in stages 1-5 may name them.
split:
  train_boxes: [set0, set1, set2, set3, set4, set5, set6, set7]
  val_boxes:   [set8, set9, set10, set11]
  test_boxes:  [set12, set13, set14, set15]
  dev_boxes:        [set12]
  final_eval_boxes: [set13, set14, set15]

# Boxes the action-space oracle and CEM are allowed to touch. Two non-final
# boxes, as Gate 1 requires ("at least three hosts and two non-final boxes").
search_boxes: [set8, set9]

# --- Host selection --------------------------------------------------------
hosts:
  # Host-mass bin indices into reward.yaml's host_mass_bins:
  #   0: 1e12  1: 3.16e12  2: 1e13  3: 3.16e13  4: 1e14
  # 2 and 3 are the upper reliable bins Gate B is decided on and the ones the
  # SR2 occupation deficit is worst in; bin 4 has ~4 hosts per box and is
  # evaluation-only everywhere else in this project, so it is not searched.
  host_bins: [2, 3]
  n_hosts: 8
  # Split the quota evenly across host_bins instead of taking the n_hosts most
  # massive. Measured on set8/set9, plain mass ordering put 16 of 16 hosts in
  # bin 3, which caps the primary result at one improved occupation bin against
  # a requirement of two. See select_editor_hosts.select_hosts.
  stratify_by_bin: true
  # Mpc/h between selected hosts. Every host in a box is edited in the SAME
  # field and scored with ONE Rockstar run -- that is what amortises the cost
  # across 8 independent proposal rewards -- and it is only sound if the edits
  # cannot interact. 6 Mpc/h is ~30 HR cells, far beyond any edit's support
  # (source_radius_rvir <= 0.30 of an Rvir that is at most ~0.9 Mpc/h).
  min_separation_mpc_h: 6.0
  min_host_particles: 2000
  # A smooth particle within this many Rvir_sub of an existing SR2 subhalo is
  # removed from the editable pool, so an edit cannot be handed credit for an
  # object that was already there.
  subhalo_exclusion_mult: 1.0

# --- The editor ------------------------------------------------------------
editor:
  # Clamp on top of the token's mass ratio. Retuned to the hosts stage 1
  # actually selects: those are ~1.4e5-member objects, so the plan's 50-300
  # particles is log_mass_ratio in [-3.45, -2.67] and the previous ceiling of
  # 400 clamped 73% of the configured ratio range onto one particle count --
  # a nearly dead search dimension. 800 leaves the top of the retuned range
  # unclamped for these hosts while still binding for the smallest ones, which
  # run_editor_candidates.py reports as n_count_clamped.
  n_particles_min: 40
  n_particles_max: 800
  # Cooling ceiling in `both` mode, kept below the contraction ceiling so the
  # mode cannot silently become velocity-only. MEASURED, not chosen: on the
  # selected set8 hosts the 400 Eulerian-nearest smooth particles already span
  # r90 ~ 100 kpc (target ~128 kpc for the ~2.3e11 Msun/h object) but carry
  # sigma_3D ~ 613 km/s against a ~89 km/s target. Producing a bound, realistic
  # subhalo therefore needs kappa_v ~ 0.82-0.91 and kappa_x ~ 0. The previous
  # cap of 0.60 put the whole viable region outside the search space.
  both_mode_cooling_cap: 0.92

  # Search budget by mode, REBALANCED from the same measurement.
  #
  # The plan's prior -- velocity is the junior partner, from the HR oracle's
  # 72.9% displacement-only recovery -- does not transfer, because the oracle
  # selects a real subhalo's *Lagrangian* member sites, which are already
  # kinematically coherent. Selecting the Eulerian-nearest particles hands the
  # editor the host's full dispersion, so cooling is the dominant lever.
  #
  # Under the old weights, `disp` (kappa_v pinned to 0) and `both` (capped at
  # 0.60) took 90% of the Rockstar budget and neither could reach the region
  # where a bound object exists. `disp` is kept as a genuine control -- if it
  # ever succeeds, the coherence argument above is wrong and that is worth
  # knowing -- and `vel` is promoted from token to serious, because on this
  # selection rule it is the mode most likely to work.
  mode_weights: {disp: 0.15, both: 0.60, vel: 0.25}
  # Bounds of the 12-d search vector, in the order local_editor.SEARCH_PARAMS
  # declares them. Derived from the training-box catalogs by
  # scripts/reward/select_editor_hosts.py --report-bounds; these are the
  # starting values, not fixed physics.
  bounds:
    # Retuned from the measured host sizes, not from the plan's round numbers:
    # at ~1.4e5 members this spans 44-557 particles, bracketing the intended
    # 50-300. The old [-3.0, -1.3] reached 7e3 particles, far beyond anything
    # the clamp would build.
    log_mass_ratio:     [-3.5, -2.4]
    radius_rvir:        [0.08, 0.90]
    dir_cos_theta:      [-1.0, 1.0]
    dir_phi:            [0.0, 6.283185307179586]
    center_offset_x:    [-0.15, 0.15]
    center_offset_y:    [-0.15, 0.15]
    center_offset_z:    [-0.15, 0.15]
    # Lower bound set by a counting argument, not by taste. A 1e13 Msun/h host
    # holds ~1.7e4 particles inside Rvir ~ 0.5 Mpc/h, i.e. a MEAN density of
    # 3.3e4 per (Mpc/h)^3 (an under-estimate near the centre, an over-estimate
    # at 0.9 Rvir). Particles inside the window at radius f * Rvir:
    #   f = 0.02 -> 0.1    f = 0.05 -> 2    f = 0.08 -> 9
    #   f = 0.10 -> 17     f = 0.20 -> 138  f = 0.30 -> 464
    # Below ~0.08 every claimed particle falls outside the window, w = 0
    # everywhere, and the "edit" is a no-op that still costs a full Rockstar
    # run and still scores zero -- indistinguishable from an edit that was tried
    # and failed. run_editor_candidates.py reports n_active per proposal and
    # aggregate_cem_round.py reports the inert fraction, so if this bound is
    # still too low the round says so instead of quietly wasting budget.
    source_radius_rvir: [0.08, 0.30]
    contraction:        [0.0, 0.95]
    velocity_cooling:   [0.0, 0.95]
    bulk_velocity_mix:  [0.0, 1.0]
    edge_softness:      [0.05, 1.0]

# --- Object-level reward ---------------------------------------------------
reward:
  base_match_pos_mpc: 0.20
  base_match_mass_dex: 0.60
  proposal_pos_tol_rvir: 0.35
  proposal_mass_tol_dex: 0.80
  w_detected: 1.0
  w_mass: 0.5
  w_position: 0.5
  sigma_mass_dex: 0.35
  # Host preservation. One "unit" of damage in any channel costs as much as
  # half a detection, so an edit that creates an object by wrecking its parent
  # scores worse than doing nothing.
  lambda_host: 1.0
  host_dmass_tol_dex: 0.05
  host_dpos_tol_rvir: 0.10
  host_dvmax_tol: 0.10
  host_lost_penalty: 3.0
  lambda_artifact: 0.5
  artifact_radius_rvir: 3.0
  artifact_scale: 4.0
  # The compactness proxy is a TIE-BREAK ONLY. It is reported on every
  # candidate, it is never added to r_j, and is_scientific_success() ignores it.
  # Leave at 0.0; aggregate_cem_round.py applies it as a lexicographic
  # tie-break, not as a weight.
  proxy_weight: 0.0
  # Full-box statistics reported (never optimised) alongside every candidate.
  reliable_host_bins: [0, 1, 2, 3]
  upper_reliable_host_bins: [2, 3]

# --- CEM -------------------------------------------------------------------
cem:
  rounds: 3
  candidates_per_round: 28     # candidate BOXES, i.e. Rockstar runs
  proposals_per_box: 8         # one per selected host -> 8 rewards per run
  elite_frac: 0.2
  min_elites: 3
  sigma_floor: 0.25
  explore_mix: 0.25
  init_sigma: 1.5
  seed: 0

# --- Conditional action flow (stage 5) -------------------------------------
flow:
  width: 128
  depth: 3
  steps: 4000
  batch_size: 128
  lr: 1.0e-3
  weight_tau: 0.5
  weight_max: 10.0
  # Frozen-reference velocity penalty. W2-motivated, NOT the ORW-CFM-W2
  # objective; see src/cosmo_sr/reward/action_flow.py.
  reference_penalty: 0.1
  reference_warmup_steps: 800
  baseline_components: 4
  eval_samples: 256
  seed: 0

# --- Variable cardinality (stage 6) ----------------------------------------
tokens:
  # Built from TRAINING boxes only. Aggregate training-catalog distributions
  # are what stage 3 permits; the target box's HR catalog is not.
  library_boxes: [set0, set1, set2, set3]
  donor_dex: 0.15
  max_tokens_per_host: 8
  min_host_particles: 2000
  existing_match_tol_dex: 0.25

# --- Feasibility -----------------------------------------------------------
constraints:
  # CALIBRATED 2026-08-02 by scripts/reward/audit_local_editor_constraints.py
  # over 18 deployment-legal editor candidates, 18 successful HR-oracle
  # interventions, 6 oracle random-particle controls and 2 frozen anchors
  # (set8, set9). Report: $DMSR_LOCAL_EDITOR_ROOT/audit/constraints_proposal.json
  #
  # READ THIS BEFORE TRUSTING `feasible_field`. Neither threshold binds on the
  # editor:
  #
  #   low_k_change         threshold 1.17e-1, editor max 3.87e-4  -> 302x headroom
  #   lr_consistency_error threshold 9.29e-1, editor max 4.64e-1, and the frozen
  #                        box is already 4.6432e-1 -- the edit moves it in the
  #                        6th decimal, so it cannot discriminate at all.
  #
  # low_k_change is set by the HR oracle's interventions (up to 5.8e-2), which
  # the plan requires the threshold to accept; those replace the field with real
  # HR content over a dilated mask and are far larger than a few hundred
  # contracted particles. The consequence is that `feasible_field: true` is NOT
  # evidence that an edit was gentle -- it will be true for essentially anything
  # this editor can do. What actually protects the parent host is the
  # host-damage term of the object-level reward (lambda_host, host_d*_tol),
  # which is measured per proposal and does bind.
  #
  # The one thing these numbers do certify: the no-op arm measured low_k_change
  # exactly 0.0 on the real 512^3 box, so the "zero contraction and zero cooling
  # return SR2 bit-for-bit" invariant holds in production, not just in tests.
  calibrated: true
  low_k_change_max: 0.11670124315222766
  lr_consistency_error_max: 0.928879508670765
  # Require the HR field to measure, which a deployment-legal editor may not read.
  density_power_error_max: null
  displacement_power_error_max: null
  # A property of the action distribution, not of one candidate; measured by
  # evaluate_local_editor.py instead.
  diversity_min: null

rockstar:
  binary: external/rockstar/rockstar
  config: configs/sr2_baseline/rockstar.cfg

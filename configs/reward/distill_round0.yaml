# Stage 8: one offline reward-weighted distillation round.
#
#   L = L_sup + lambda_elite * L_elite + lambda_ref * L_ref
#
# L_sup   denoising on the real HR - SR2 residual targets (kept throughout);
# L_elite reward-weighted denoising on selected generated residuals;
# L_ref    consistency with the frozen residual prior (the teacher).
#
# Exactly one round: candidates are never regenerated during optimisation.
base: residual_prior.yaml

distill:
  init_from: null            # residual-prior checkpoint; set by the sbatch script
  teacher_checkpoint: null   # frozen copy of the same prior, for L_ref
  replay_manifest: null      # $ZFS/dmsr_reward/replay/round_000/replay.jsonl
  paired_fraction: 0.5       # fraction of each batch drawn from paired supervision
  lambda_elite: 1.0
  lambda_elite_warmup_steps: 2000   # ramp 0 -> lambda_elite
  lambda_ref: 0.1
  tau: 1.0
  a_max: 5.0
  w_max: 10.0
  weight_normalize: mean
  # Abort conditions checked at every validation; a tripped flag stops the run
  # instead of quietly producing a broken checkpoint.
  abort_on:
    residual_rms_ratio_max: 3.0     # vs the prior's residual RMS
    low_k_change_max: 0.05
    diversity_min: 0.02
    elite_weight_ratio_max: 5.0     # max elite weight / batch mean weight

train:
  steps: 20000
  # batch_size 1, NOT the 4 this used to inherit from a pre-context config.
  # distill_round0 inherits residual_prior's data.context_margin = 48, so an
  # input is 160^3, not 64^3 -- which is exactly why the prior itself dropped to
  # batch 1 (see the note in residual_prior.yaml). Distillation is then strictly
  # heavier than the prior at the same batch size: every accumulation step holds
  # a paired graph AND an elite graph, and with lambda_ref > 0 a frozen teacher's
  # activations as well. Effective batch stays 8 through grad_accum, matching the
  # prior, so the student is not trained under a different batch than its
  # teacher.
  batch_size: 1
  grad_accum: 8
  lr: 3.0e-5
  warmup: 500
  val_every: 1000
  ckpt_every: 1000

wandb:
  mode: disabled
  name: reward_distill_round0

# Direct reward-guided fine-tuning of the SR2 generator G_theta(Y, z).
#
# This file is the single source of truth for the DIRECT line. It deliberately
# does not modify configs/reward/reward.yaml: the residual line's constraint
# severities, bins and reward fit stay exactly as they are, and are READ from
# here rather than redefined, so the two lines cannot drift apart on what a
# "reward" is while disagreeing about what a "pass" is.
#
# What this line is NOT:
#   * it does not train a residual generator (that is the reward.yaml line);
#   * it does not implement ControlNet;
#   * it does not touch any existing residual/reward code path.

reward_config: configs/reward/reward.yaml
freeze: configs/sr2_baseline/freeze.yaml

model:
  # The pretrained generator every stage starts from. theta_0.
  path: external/SRS-map2map/SRmodel/G_z0.pt
  scale_factor: 8
  in_chan: 6
  out_chan: 6

# The DEPLOYED tiling. These are not tunables: a tile is one generator forward
# pass, and the per-tile catalog labels are attached to exactly that.
geometry:
  ng_lr: 64
  ng_hr: 512
  nsplit: 8
  pad: 3
  tile_hr: 64
  boxsize_mpc_h: 100.0
  dis_norm_kpc_h: 6000.0

# --- The supervision unit ----------------------------------------------------
# The proxy's target is a REGION of the 8^3 Lagrangian tile grid, and the
# deployed width is 1: the supervision unit IS the tile (region_id == tile_id,
# exactly -- see cosmo_sr.reward.regions.region_ids_from_tile_ids). Made
# explicit here because the 2026-08-09 "per-tile target is not rankable"
# verdict pivoted this line to a pooled target; the region re-analysis
# (docs/sr2_direct_finetune.md) showed the corrected within-tile ordering
# stability is ~0.99 and the pivot was not warranted. Candidates are grouped by
# (box, region_id) for both ranking pairs and evaluation metrics.
proxy_unit: region
region_width: 1

split:
  # Mirrors reward.yaml. Repeated so a leak is a diff, not an inference.
  proxy_fit_boxes:   [set0, set1, set2, set3, set4, set5, set6, set7]
  proxy_gate_boxes:  [set8, set9, set10, set11]
  actor_train_boxes: [set0, set1, set2, set3, set4, set5, set6, set7]
  actor_eval_boxes:  [set8, set9, set10, set11]
  # set12 is already development-contaminated (the SR2 subhalo study and the
  # reward sanity check both ran on it), so it may serve as a LATE PREFLIGHT and
  # never as final evidence. set13-15 stay sealed until the final comparison.
  preflight_boxes:   [set12]
  sealed_boxes:      [set13, set14, set15]

# --- The differentiable structural features --------------------------------
soft_structure:
  # Soft thresholds are applied to log1p(delta); see the module docstring for
  # why a delta-proportional sigmoid put a 0.054 pedestal under a signal of a
  # few percent.
  compact_delta: 100.0
  envelope_lo: 10.0
  envelope_hi: 100.0
  tau_log: 0.35
  peak_scales: [1, 2, 4]
  peak_deltas: [100.0, 30.0, 10.0]
  contrast_margin: 1.5
  n_power_bands: 4
  # Valid-centre CIC region as a fraction of the 64^3 crop. 0.5 is the value the
  # measured table in cic_density_valid_center puts at rel-RMS 0.030 / corr
  # 0.9995 / 97% of the mass kept.
  region_fraction: 0.5
  grid_mult: 1

# --- The phase-space block (arms B and C) ------------------------------------
# Arm A is soft_structure alone; arm B is soft_structure + these; arm C's token
# grid reads the same deposited mass/momentum/v^2 fields. Nothing else differs
# between the arms, which is what makes the comparison an answer about
# features rather than about tuning.
phase_space:
  # What velnorm(., z=0, undo=True) multiplies a stored velocity channel by.
  # Written into every manifest so a feature vector computed at one redshift can
  # never be silently compared with one computed at another.
  vel_norm_km_s: 313.42210244571896
  v_ref_km_s: 300.0
  coherence_scales: [1, 2, 4]
  # Om = 0.2814, 100 Mpc/h, 512^3.
  particle_mass_msun_h: 581881454.8686146

# --- The soft-Rockstar token grid (arm C only) -------------------------------
# Arm C reduces the valid-centre deposit (32^3 cells for a 64^3 crop) to an
# 8^3 token grid -- 4^3 cells per token -- and gives each token the local,
# per-token analogue of the arm A/B summaries. The encoder that reads the
# tokens is configured under proxy.arm_c below; this block is only about the
# FEATURES, which are serialized into every candidate and must therefore be
# fixed before any of them is generated.
soft_rockstar:
  tokens_per_axis: 8
  # Multiscale density contrast at the same scales as soft_structure's peak
  # ladder, so a token contrast and a crop peak feature describe the same
  # smoothing and any disagreement between arms is about locality, not scale.
  contrast_scales: [1, 2, 4]
  # One coherence scale (not the full ladder): the token already localises, so
  # the ladder's job -- separating "coherent" from "clumpy" from "hot" -- is
  # mostly done by the grid, and one scale keeps the token vector at 8 numbers.
  coherence_scale: 2

# --- The labelled dataset (phases 1-3) --------------------------------------
# The predeclared candidate matrix. Fixed BEFORE any of it is generated: a
# matrix chosen after looking at labels is a hyperparameter, and this one is
# meant to be evidence.
proxy_dataset:
  # 12 boxes x 8 candidates = 96 full-box Rockstar runs. set12 is preflight-only
  # and set13-15 are sealed; neither appears here.
  boxes: [set0, set1, set2, set3, set4, set5, set6, set7,
          set8, set9, set10, set11]
  frozen_seeds: [0, 1, 2, 3]
  alphas: [0.25, 0.5, 1.0]
  # The core intervention edits displacement AND velocity together.
  core_intervention_mode: both
  # Predeclared diagnostic subset: the same alpha ladder in displacement-only
  # and velocity-only form, on four boxes (two fit, two held out). This is the
  # ONLY thing that can answer "does arm B see information arm A cannot" -- an
  # arm-B win on candidates where velocity never moved independently would be
  # unattributable.
  diagnostic_boxes: [set0, set1, set8, set9]
  diagnostic_modes: [disp, vel]
  # Targets for the HR-directed masks, selected from the frozen SR2 vs HR
  # catalogs. Same cuts as the Experiment-1 oracle so the interventions are the
  # operation that study measured, not a lookalike.
  intervention:
    max_targets: 24
    min_sub_particles: 50
    min_separation_mpc_h: 6.0
    host_bins: [2, 3]
    dilate: 2
    smooth: 1.5
  # A four-candidate integrity smoke test runs first -- hr, two frozen seeds and
  # one full-strength intervention, enumerated in submit_proxy_labels.sh, which
  # is the thing that runs. Its labels are inspected for integrity ONLY: fitting
  # even a preliminary MLP on them would make the smoke test part of the model
  # selection.

# --- The proxy --------------------------------------------------------------
proxy:
  # 3-5 members. The actor maximises mean - beta*std across them, so a single
  # member silently disables the uncertainty penalty.
  n_members: 5
  hidden: [128, 128]
  dropout: 0.0
  epochs: 400
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 256
  huber_delta: 1.0
  # Capped inverse-frequency weighting over the 16 predicted counts. Uncapped,
  # the 3.16e13 host bin (~30 hosts/box against ~1300 in the lowest) would take
  # ~40x the loss while carrying the noisiest label of the set.
  bin_weight_cap: 8.0
  bin_weight_floor: 0.25
  # Ranking pairs are formed ONLY within the same (box, tile_id).
  ranking_weight: 1.0
  max_pairs_per_group: 32
  # Drop pairs whose true reward gap is below this: with a small edit most pairs
  # are ties and training on them is pure label noise.
  min_pair_margin: 0.0
  # Row weighting. HR and frozen rows are 5 of the 8 candidates per box and are
  # the easy ones; without balancing they set the loss and the intervention
  # ladder -- the only rows that vary locally and monotonically -- is a rounding
  # error in it. Weights are per SOURCE, normalised to mean 1, and multiplied by
  # `changed_tile_weight` on tiles the intervention mask actually touched.
  balance_sources: true
  changed_tile_weight: 3.0
  # A tile counts as "changed" when the candidate's own feature difference from
  # frozen is above this in absolute value, in units of that feature's training
  # standard deviation. Measured on the features, not on the mask, so it means
  # the same thing for actor candidates that have no mask at all.
  changed_tile_threshold: 0.5
  # Ensemble members are box-BOOTSTRAP samples, not just different seeds.
  # Re-initialising the same data five times measures optimisation noise; the
  # spread the actor's uncertainty penalty needs is the spread over which boxes
  # were seen, which is the real sampling variability.
  bootstrap_boxes: true
  # Arm C's model class (SoftRockstarProxy). ONE fixed, predeclared
  # configuration -- there is no hyperparameter sweep in this experiment (see
  # proxy_cv below); a model class gets exactly one architecture, declared
  # before any held-out number is seen. Everything shared (epochs, losses,
  # weights, optimizer budget, bootstrap draws) comes from the keys above and
  # is identical across the three arms.
  arm_c:
    token_hidden: [64, 64]
    embed_dim: 32
    # mean + max + logsumexp over tokens, concatenated.
    pools: [mean, max, lse]

# --- Model selection (phase 5) ----------------------------------------------
# There is NO hyperparameter sweep in this experiment. Each model class trains
# once, with the single predeclared configuration above (proxy: for arms A/B,
# proxy.arm_c: for arm C), on the same rows, targets, losses, row weights,
# epochs, bootstrap draws and optimizer budget. The earlier grouped-CV grid was
# removed deliberately: with three arms it multiplied the budget and invited a
# winner chosen on tuning rather than on features.
proxy_cv:
  enabled: false

# The proxy must clear ALL of these on the held-out boxes before the actor is
# allowed to run. Failing them is NOT a reason to unfreeze more of SR2; it is a
# reason to improve the proxy or its data, or to move to the true-catalog
# oracle-renderer experiment.
proxy_gate:
  min_within_tile_spearman: 0.5
  min_pairwise_accuracy: 0.65
  # Fraction of proxy-selected top candidates that really improved R_occ.
  min_selected_positive_fraction: 0.6
  # Single-feature ablation: dropping any one feature must not leave the proxy
  # essentially as good, or the "proxy" is one number wearing a vector's name.
  # For arm C the "feature" is a token channel, ablated across all tokens.
  max_single_feature_ablation_retention: 0.9
  # Pooled occupation-curve prediction, in EVERY reliable host bin -- not on
  # average. A mean hides a bin that is wrong by a factor of two behind four
  # that are right, and the bins are not interchangeable: 2 and 3 are where the
  # decision is.
  max_occupation_curve_log_error: 0.3
  # Pooled full-box (N, H, S, O) must beat the frozen/zero-change, training-mean
  # and linear-regression baselines. A proxy that cannot beat "predict no
  # change" has learned nothing an actor can use.
  must_beat_baselines: [zero_change, train_mean, linear]
  # Ensemble spread must be informative: rows the ensemble disagrees about must
  # be the rows it gets wrong, or `beta` in the actor's LCB is penalising noise.
  min_uncertainty_error_spearman: 0.2
  # The oracle-intervention alpha ladder ordering is REPORTED for every arm and
  # never gated on, and the winner is never chosen from it alone: the ladder's
  # within-unit order is monotone by construction, so it measures the easy part
  # of the problem. (It used to be a >= 0.8 gate; demoted deliberately.)
  report_only_alpha_ordering: true
  # Reported, never gated: the 1e14 host bin holds ~1 object per box, so a
  # "failure" there is a Poisson draw.
  report_only_host_bins: [4]

# --- The real actor-like Rockstar gate (phase 5b) ----------------------------
# NOT another alpha-ladder. For every arm that clears the offline proxy_gate
# above, a short probe_only fine-tune runs against that arm's frozen proxy, the
# probe checkpoint is applied to held-out boxes, and 12 actor-GENERATED tile
# replacements are spliced into the frozen boxes and re-run through the real
# halo finder. Only sign agreement against those fresh full-box Rockstar
# rewards can authorize direct SR2 fine-tuning. Missing results make the
# criterion unmet, never passed, and the benchmark refuses to advance any arm
# without them.
actor_gate:
  # The probe: explicitly marked, never resumable as the production run.
  probe_rung: proj_noise
  probe_max_steps: 300
  probe_boxes: [set0, set1]          # fit boxes ONLY; the checkpoint is judged
                                     # on held-out boxes it never trained on.
  # The verification: actor tiles across at least three of set8-11.
  verify_boxes: [set8, set9, set10]
  n_actor_checks: 12
  min_actor_boxes: 3
  min_actor_sign_agreement: 0.75
  actor_strata: [predicted_positive, high_uncertainty, random]
  # The probe checkpoint must also pass the paired density and low-k
  # preservation gates (gates: block below) before its splices mean anything:
  # a probe that broke the field would fail for reasons the proxy cannot see.
  require_probe_field_gates: true

# --- Predeclared reporting slices (phase 5) ---------------------------------
# Fixed here so the slices cannot be chosen after the numbers are seen.
proxy_report_slices:
  all: {}
  near_sr2: {sources: [frozen, frozen_seed], alphas: null}
  interventions_both: {sources: [intervention], modes: [both]}
  interventions_disp: {sources: [intervention], modes: [disp]}
  interventions_vel: {sources: [intervention], modes: [vel]}
  hr_anchor: {sources: [hr]}

# --- The actor --------------------------------------------------------------
actor:
  rung: proj_noise            # proj_noise | fine | middle_fine | all_blocks | full
  group_lr:
    proj_noise: 1.0e-5
    fine: 3.0e-6
    middle: 1.0e-6
    coarse: 3.0e-7
  weight_decay: 0.0
  max_steps: 2000
  batch_size: 2
  # Seed diversity, same LR tile. NOT two tiles. Draw 0 is always the base
  # seed, whose frozen catalog context is the one the labels were measured
  # against -- so the proxy reward and its catalog-context swap use draw 0
  # ONLY, and the second draw exists exclusively for the diversity term.
  noise_draws: 2

  # Occupation is primary; the joint score is kept at a small weight so
  # abundance cannot be traded away entirely to buy occupation. All three are
  # logged separately every step regardless.
  w_occ_reward: 1.0
  w_joint_reward: 0.25
  beta_uncertainty: 1.0

  lambda_reward: 1.0
  lambda_density_power: 10.0
  lambda_low_k: 100.0
  lambda_prox: 1.0
  lambda_diversity: 10.0
  d_struct_min: 0.05
  # The surrogate does not get to move anything until the exact guards are
  # established.
  reward_warmup_steps: 200

  grad_clip: 1.0
  amp: true
  ema_decay: 0.999
  grad_norm_every: 25
  log_every: 10
  checkpoint_every: 250
  seed: 0
  density_power_bands: 8

# --- Checkpoint gates -------------------------------------------------------
# RELATIVE, and paired on (box, seed) against frozen SR2. reward.yaml's
# density_power_error_max = 0.03751 is 1.5x the WORST frozen-vs-HR error, which
# is the right bound for "materially worse than the baseline" and much too
# permissive for "no degradation" -- it admits a checkpoint that makes density
# 50% worse than SR2's own error. It is kept below only as an absolute backstop.
gates:
  # PLACEHOLDERS. Run the frozen seed-to-seed calibration
  # (scripts/reward/gate_sr2_direct.py --stage calibrate) and paste the proposal
  # in, then set calibrated: true. Nothing downstream will pass while this is
  # false, which is the point.
  calibrated: false
  mean_degradation_max: null
  single_box_degradation_max: null
  # Inherited from the residual line's calibration (0.1x the HR box-to-box
  # scatter). Rewriting the LR-visible scales means the output is no longer a
  # refinement of the thing that was validated.
  low_k_change_max: 0.139595
  d_struct_min: 0.05
  density_power_error_max: 0.03751

calibration:
  # Frozen-generator seeds used to measure the seed-to-seed spread that sets the
  # tolerances above. More seeds is a better tolerance, not a looser one.
  seeds: [0, 1, 2, 3]
  boxes: [set0, set1, set2, set3]
  mean_margin: 1.0
  single_margin: 2.0

# --- Rockstar feedback loop -------------------------------------------------
# Section 10: a deliberately small overfit FIRST, then dataset aggregation.
overfit:
  boxes: [set0]
  # Host-rich tiles, chosen by the frozen box's own tile summaries.
  n_tiles: 4
  tile_selection: host_rich
  rung: proj_noise
  max_steps: 300
  # The real result, not the proxy, decides. Improvement in at least two
  # reliable host bins, at least one of which is bin 2 or 3.
  min_improved_reliable_bins: 2
  min_improved_upper_bins: 1
  upper_reliable_host_bins: [2, 3]

dagger:
  rounds: 3
  candidates_per_round: 4
  # Proxy and actor are NEVER updated from the same minibatches: a round trains
  # the actor, then labels new candidates, then refits the proxy, then
  # revalidates it, then resumes from the last FIELD-VALID actor checkpoint.
  refit_proxy_each_round: true
  resume_from_last_field_valid: true

# --- Original SR2 adversarial continuation ----------------------------------
# CHECKED ON THIS CLUSTER: external/SRS-map2map/SRmodel/ contains G_z0.pt and
# G_z2.pt only, and no D_* checkpoint exists anywhere under $ZFS. So there is no
# original critic, the mainline weight is zero, and a freshly initialised critic
# is NOT "ordinary SR2 continuation" -- it is a random objective. It may be run
# later as a separate, clearly-labelled ablation after a frozen-generator
# warm-up. dmsr.HRCritic is deliberately not reused: it was designed for
# high-pass residual fields and sees different inputs.
adversarial:
  weight: 0.0
  allow_fresh_critic: false
  checkpoint: ""
  gp_lambda: 10.0
  gp_every: 16
  critic_steps_per_generator_step: 1
  critic_lr: 1.0e-4
  critic_betas: [0.0, 0.9]
  critic_width: 64
  critic_depth: 4
  # 6 upsampled LR + 6 candidate/HR displacement+velocity + 8 inverse-pixel-
  # shuffled fine CIC density = 20 channels.
  density_grid_mult: 2
  critic_warmup_steps: 1000

paths:
  # Every bulky artifact of this line. NOT the repository, NOT home.
  root_env: DMSR_SR2_DIRECT_ROOT
  default_root: ${ZFS}/DMSR/dmsr_reward/sr2_direct

rockstar:
  binary: external/rockstar/rockstar
  # FULL_PARTICLE_CHUNKS = 1: the member-particle table is what makes exact
  # fractional tile attribution possible.
  config: configs/sr2_baseline/rockstar_particles.cfg
  chunk_rows: 8000000
  # The ~7 GB ASCII table is streamed into a compressed summary and DELETED in
  # the same job. It must never survive the allocation.
  delete_particles: true

# Rockstar config for the **LR** (64^3) boxes, with member-particle-ID output.
#
# This is NOT the frozen HR config and must never be used to produce an HR
# catalog: the numbers below that differ from configs/sr2_baseline/rockstar.cfg
# are resolution-dependent, and mixing them would silently change every HR
# result the project rests on.
#
# Differences from the frozen config, and why:
#
#   FULL_PARTICLE_CHUNKS = 1
#       Output only -- prints halos_<scale>.0.particles, the member-id table.
#       For a 64^3 box that is ~2.6e5 rows (~20 MB), three orders of magnitude
#       smaller than the HR table, so it is kept on disk as the rebuild cache
#       rather than streamed-and-deleted.
#
#   FORCE_RES = 0.04
#       The LR lattice is 8x coarser than HR (mean spacing 1.5625 vs 0.195
#       Mpc/h), so the frozen 0.005 would claim a force resolution the LR
#       simulation does not have. Scaled by the same factor of 8.
#
# Everything else -- cosmology, box size, periodicity, MIN_HALO_OUTPUT_SIZE,
# UNBOUND_THRESHOLD, the serial full-box mode -- is identical to the frozen
# config. At the LR particle mass (Om * rho_crit * L^3 / 64^3 = 2.98e11
# Msun/h) the 20-particle floor is a floor on num_p, not on Mvir -- Rockstar's
# SO mass runs ~0.65x num_p * m_p (measured on set8; 0.73x in the frozen HR
# catalog, so this is not an LR artifact). Measured set8 host range:
# 10^11.78 .. 10^14.84 Msun/h, 832 hosts + 196 subhalos. Massive hosts only,
# which is exactly the regime the conditioning feature is about.

FILE_FORMAT = "GADGET2"
GADGET_LENGTH_CONVERSION = 1
GADGET_MASS_CONVERSION = 1e10

SCALE_NOW = 1.0
h0 = 0.697
Om = 0.2814
Ol = 0.7186

PERIODIC = 1
BOX_SIZE = 100.0

FORCE_RES = 0.04

MIN_HALO_OUTPUT_SIZE = 20
UNBOUND_THRESHOLD = 0.5
OUTPUT_FORMAT = "ASCII"
STRICT_SO_MASSES = 0
FULL_PARTICLE_CHUNKS = 1
NUM_BLOCKS = 1
NUM_WRITERS = 1
PARALLEL_IO = 0
DELETE_BINARY_OUTPUT_AFTER_FINISHED = 1

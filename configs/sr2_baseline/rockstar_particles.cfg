# Rockstar config for member-particle-ID output (Experiment 0 tile decomposition).
#
# IDENTICAL to configs/sr2_baseline/rockstar.cfg except for the single line
# FULL_PARTICLE_CHUNKS, which is 0 there and 1 here. That flag is *output only*:
# io/meta_io.c::output_halos calls output_full_particles() after output_ascii()
# and after every halo property has been computed, so the halo catalog this run
# produces is bit-identical to the frozen one. scripts/reward/rockstar_particles.py
# --verify-frozen checks that claim against the existing catalog rather than
# asserting it, and refuses to continue if the two disagree.
#
# The extra output is halos_<scale>.0.particles, an ASCII table
#   x y z vx vy vz particle_id assigned_internal_haloid internal_haloid external_haloid
# of roughly 8e7 lines / ~7 GB for a 512^3 box. It is streamed into a compact
# per-tile npz and deleted in the same job; it must never land in $HOME.

FILE_FORMAT = "GADGET2"
# Lengths in our GADGET dumps are already Mpc/h; masses are in 1e10 Msun/h.
GADGET_LENGTH_CONVERSION = 1
GADGET_MASS_CONVERSION = 1e10

# Cosmology (WMAP9; also written into the GADGET header).
SCALE_NOW = 1.0
h0 = 0.697
Om = 0.2814
Ol = 0.7186

# Full-box periodic finding (required). Upstream Rockstar forces PERIODIC=0
# when PARALLEL_IO=0; we patch config.c so this flag is honored for serial
# full-box runs (see external/rockstar/config.c::setup_config).
PERIODIC = 1
BOX_SIZE = 100.0

# Softening-scale force resolution ~2.5 HR cells (512^3 in 100 Mpc/h → Δx≈0.195 Mpc/h).
FORCE_RES = 0.005

MIN_HALO_OUTPUT_SIZE = 20
UNBOUND_THRESHOLD = 0.5
OUTPUT_FORMAT = "ASCII"
STRICT_SO_MASSES = 0
# The ONLY difference from the frozen config. chunk 0 < 1, so the single serial
# writer emits its member-particle table.
FULL_PARTICLE_CHUNKS = 1
# Single-process full-box mode with patched PERIODIC=1.
NUM_BLOCKS = 1
NUM_WRITERS = 1
PARALLEL_IO = 0
DELETE_BINARY_OUTPUT_AFTER_FINISHED = 1

# Frozen Rockstar config for the SR2 subhalo study (z=0, periodic full boxes).
# Do not retune per experiment; change freeze_version if this file changes.
#
# Run via: cosmo_sr.eval.rockstar.run_rockstar(...) or
#   ./external/rockstar/rockstar -c <this> <gadget2.snap>

FILE_FORMAT = "GADGET2"
# Lengths in our GADGET dumps are already Mpc/h; masses are in 1e10 Msun/h.
GADGET_LENGTH_CONVERSION = 1
GADGET_MASS_CONVERSION = 1e10

# Cosmology (WMAP9; also written into the GADGET header).
SCALE_NOW = 1.0
h0 = 0.697
Om = 0.2814
Ol = 0.7186

# Full-box periodic finding (required). Upstream Rockstar forces PERIODIC=0
# when PARALLEL_IO=0; we patch config.c so this flag is honored for serial
# full-box runs (see external/rockstar/config.c::setup_config).
PERIODIC = 1
BOX_SIZE = 100.0

# Softening-scale force resolution ~2.5 HR cells (512^3 in 100 Mpc/h → Δx≈0.195 Mpc/h).
FORCE_RES = 0.005

MIN_HALO_OUTPUT_SIZE = 20
UNBOUND_THRESHOLD = 0.5
OUTPUT_FORMAT = "ASCII"
STRICT_SO_MASSES = 0
# Keep off unless dumps are explicitly written to scratch (home quota).
FULL_PARTICLE_CHUNKS = 0
# Single-process full-box mode with patched PERIODIC=1.
NUM_BLOCKS = 1
NUM_WRITERS = 1
PARALLEL_IO = 0
DELETE_BINARY_OUTPUT_AFTER_FINISHED = 1

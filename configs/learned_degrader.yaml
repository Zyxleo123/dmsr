# Learned degrader (stage 2). D_phi(x_2R, R) = A_R(x_2R) + Delta_phi(x_2R, R).
factor: 2
resolutions: [64, 128, 256]

data:
  paired_hr_glob: "/zfsauton/scratch/yixiz/DMSR/paired_catnorm/hr/set[0-2].npy"
  val_hr_glob: "/zfsauton/scratch/yixiz/DMSR/paired_catnorm/hr/set15.npy"
  crop_hr: 128
  n_levels: 4
  full_res: 512
  mmap: true

model:
  channels: 6
  width: 32
  depth: 2
  use_res_embed: true
  embed_dim: 64

loss:
  lambda_delta: 1.0e-3

train:
  batch_size: 1
  lr: 1.0e-4
  steps: 20000
  seed: 0
  log_every: 50
  save_every: 2000
  eval_every: 500
  amp: true

wandb:
  mode: online
  project: cosmo_sr
  name: learned_degrader
  group: null

output:
  run_dir: runs/learned_degrader
